<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eleva — ajuda pública e Libras</title>
    <link rel="stylesheet" href="/help.css" />
    <script src="/public-appearance.js"></script>
  </head>
  <body>
    <main>
      <h1>Eleva — apoio em Libras</h1>
      <p>
        Instruções públicas em uma área isolada. O widget não acessa as telas da criança. A tradução
        automática depende de rede e não substitui revisão humana.
      </p>
      <p><a href="/">Voltar ao Eleva</a></p>
      <iframe
        class="public-help"
        title="Instruções públicas com apoio VLibras"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
      ></iframe
      ><noscript
        >As instruções em texto estão disponíveis no aplicativo. JavaScript é necessário para o
        apoio automático.</noscript
      >
    </main>
  </body>
</html>
